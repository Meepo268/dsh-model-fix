name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Check tag matches package version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi

      - name: Check README pins the release URL
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! grep -qF "releases/download/v${VERSION}/dsh-model-fix.tgz" README.md; then
            echo "::error::README.md does not pin the tarball URL releases/download/v${VERSION}/dsh-model-fix.tgz; update the install links before releasing"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify and pack tarball
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm pack:release

      - name: Inspect tarball contents
        run: tar -tzf dist/*.tgz | head -50

      - name: Prepare release notes
        run: |
          NOTES="release_notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-notes.md
          else
            touch release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*.tgz
          generate_release_notes: true
          make_latest: true
